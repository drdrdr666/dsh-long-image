<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-long-image">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dfeeff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cf6"/>
      <stop offset="1" stop-color="#17b3a3"/>
    </linearGradient>
  </defs>

  <!-- 长图纸张 -->
  <rect x="12" y="4" width="40" height="56" rx="4" fill="url(#page)" stroke="#2b6cf6" stroke-width="2"/>

  <!-- 正文纹理行（被切口打断） -->
  <g fill="#2b6cf6" opacity="0.55">
    <rect x="18" y="11" width="28" height="2.4" rx="1.2"/>
    <rect x="18" y="16.5" width="22" height="2.4" rx="1.2"/>
    <rect x="18" y="22" width="26" height="2.4" rx="1.2"/>
    <rect x="18" y="33" width="24" height="2.4" rx="1.2"/>
    <rect x="18" y="38.5" width="28" height="2.4" rx="1.2"/>
    <rect x="18" y="49" width="20" height="2.4" rx="1.2"/>
    <rect x="18" y="54.5" width="26" height="2.4" rx="1.2"/>
  </g>

  <!-- 空白行上的切口（虚线 = 安全切，落在空隙） -->
  <g stroke="url(#ink)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2.4">
    <line x1="10" y1="28.5" x2="54" y2="28.5"/>
    <line x1="10" y1="44.5" x2="54" y2="44.5"/>
  </g>

  <!-- 阅读标记 -->
  <circle cx="52" cy="28.5" r="3.4" fill="#17b3a3"/>
  <circle cx="52" cy="44.5" r="3.4" fill="#17b3a3"/>
</svg>
